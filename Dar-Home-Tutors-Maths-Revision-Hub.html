<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dar Home Tutors Maths Revision Hub</title>
<style>
:root { color-scheme: light dark; --bg:#f5f7fb; --surface:#fff; --surface2:#eef3ff; --text:#132238; --muted:#667085; --primary:#2457d6; --primary2:#173b96; --border:#dbe2ef; --success:#16834b; --warning:#a15c00; }
* { box-sizing:border-box; }
body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
#app { min-height:100vh; background:var(--bg); }
button { font:inherit; cursor:pointer; }
.header { position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--surface) 94%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.header-inner { max-width:1100px; margin:auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:-.02em; }
.logo { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:white; background:linear-gradient(135deg,var(--primary),#6b8df0); font-weight:900; }
.header-actions { display:flex; gap:8px; }
.ghost { border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 13px; border-radius:10px; }
main { max-width:1100px; margin:auto; padding:34px 20px 60px; }
.hero { display:grid; grid-template-columns:1.35fr .85fr; gap:28px; align-items:center; padding:24px 0 38px; }
.eyebrow { color:var(--primary); font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.08em; }
h1 { font-size:clamp(34px,6vw,62px); line-height:1.02; margin:10px 0 18px; letter-spacing:-.045em; }
.hero p { color:var(--muted); font-size:18px; line-height:1.6; max-width:650px; }
.cta { border:0; background:var(--primary); color:white; padding:14px 20px; border-radius:12px; font-weight:800; box-shadow:0 8px 24px rgba(36,87,214,.22); }
.hero-card { background:linear-gradient(145deg,var(--primary2),var(--primary)); color:white; border-radius:26px; padding:28px; min-height:300px; box-shadow:0 20px 50px rgba(24,54,126,.2); }
.hero-card .math { font-size:58px; font-weight:900; margin:24px 0; }
.hero-card small { opacity:.82; }
.section-title { margin:18px 0 15px; font-size:24px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.card { border:1px solid var(--border); background:var(--surface); border-radius:16px; padding:18px; transition:.15s; }
.card:hover { transform:translateY(-2px); border-color:#b8c8ee; }
.card h3 { margin:0 0 7px; }
.card p { color:var(--muted); margin:0 0 15px; line-height:1.45; }
.card button { width:100%; }
.icon { font-size:25px; margin-bottom:10px; }
.back { margin-bottom:20px; }
.back button { border:0; background:none; color:var(--primary); padding:0; font-weight:800; }
.breadcrumb { color:var(--muted); font-size:14px; margin-bottom:9px; }
.topic-grid { grid-template-columns:repeat(3,1fr); }
.resource { display:flex; justify-content:space-between; gap:14px; align-items:center; }
.resource .left { flex:1; }
.badge { display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; font-weight:800; background:var(--surface2); color:var(--primary); margin-bottom:8px; }
.locked { opacity:.9; }
.lock { font-size:23px; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; margin-bottom:15px; }
.panel h2 { margin-top:0; }
.list { display:grid; gap:10px; }
.list button { text-align:left; border:1px solid var(--border); background:var(--surface); padding:15px; border-radius:12px; color:var(--text); }
.notice { background:var(--surface2); border:1px solid #c8d5f7; padding:15px; border-radius:12px; color:var(--text); line-height:1.5; }
.form { max-width:520px; }
label { display:block; font-weight:700; margin:15px 0 7px; }
input, textarea, select { width:100%; padding:12px 13px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); }
textarea { min-height:110px; resize:vertical; }
.actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.admin-grid { grid-template-columns:repeat(4,1fr); }
.stat strong { display:block; font-size:27px; margin-top:6px; }
footer { max-width:1100px; margin:auto; padding:25px 20px 45px; color:var(--muted); font-size:13px; }
@media (max-width:800px) { .hero { grid-template-columns:1fr; } .grid,.topic-grid { grid-template-columns:1fr 1fr; } .admin-grid { grid-template-columns:1fr 1fr; } }
@media (max-width:520px) { main { padding:24px 15px 45px; } .header-inner { padding:12px 15px; } .grid,.topic-grid,.admin-grid { grid-template-columns:1fr; } .brand span { display:none; } }
@media (prefers-color-scheme: dark) {
 :root { --bg:#0c1220; --surface:#131b2b; --surface2:#182748; --text:#edf2fb; --muted:#aab5c7; --border:#2b3850; --primary:#6e91ff; --primary2:#4265d3; }
 .header { background:color-mix(in srgb,var(--surface) 94%,transparent); }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://spdyvjkljeclvslkklph.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_HU_CuaA2SOLGkOzZ0h_7_g_3XqIZAuN';
const supabaseClient=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)||null;
const previewNetworkBlocked=!window.supabase;
const curricula = {
  primary:{title:'Primary / Checkpoint', desc:'Cambridge Primary mathematics revision.', levels:['Year 1','Year 2','Year 3','Year 4','Year 5','Year 6']},
  lower:{title:'Lower Secondary', desc:'Cambridge Lower Secondary mathematics revision.', levels:['Year 7','Year 8','Year 9']},
  igcse:{title:'IGCSE', desc:'Mathematics revision for Core and Extended learners.', levels:['Core','Extended']},
  myp:{title:'IB MYP', desc:'Mathematics revision for MYP learners.', levels:['MYP 1','MYP 2','MYP 3','MYP 4','MYP 5']},
  ibdp:{title:'IBDP', desc:'Mathematics: Analysis & Approaches and Applications & Interpretation.', levels:['AA SL','AA HL','AI SL','AI HL']},
  alevel:{title:'AS & A Level', desc:'Pure Mathematics, Statistics and Mechanics revision.', levels:['AS Mathematics','A Level Mathematics']}
};
const primaryTopics=['Numbers and sequence','Using letters to represent','Shapes','Geometry and measure','Statistics and probability'];
const secondaryTopics=['Numbers and sequence','Algebra','Measurement','Transformations and Constructions','Statistics'];
const algebraSubtopics=['Algebraic expressions','Simplifying expressions','Expanding brackets','Factorising','Linear equations','Simultaneous equations','Inequalities','Changing the subject of a formula','Sequences'];
function getSubtopics(){
  if(state.curriculum==='lower' && state.level==='Year 9' && state.topic==='Algebra') return algebraSubtopics;
  return ['Introduction','Key skills','Worked examples','Practice questions','Topic test'];
}
const state={page:'home', curriculum:null, level:null, topic:null, subtopic:null, practiceIndex:0, practiceScore:0, practiceAnswered:false, testIndex:0, testScore:0, testAnswered:false, questions:[], exam:null, examIndex:0, examScore:0, examAnswered:false};
let questionBank=JSON.parse(localStorage.getItem('dhtQuestionBank')||'[]');
const tests=JSON.parse(localStorage.getItem('dhtTests')||'[]');
const users=JSON.parse(localStorage.getItem('dhtUsers')||'[]');
let currentUser=JSON.parse(localStorage.getItem('dhtCurrentUser')||'null');
function progressData(){if(!currentUser)return {attempts:0,correct:0,tests:0,testScores:[],topics:[],recent:[]};return JSON.parse(localStorage.getItem('dhtProgress_'+currentUser.id)||'{"attempts":0,"correct":0,"tests":0,"testScores":[],"topics":[],"recent":[]}')}
function saveProgress(p){if(currentUser)localStorage.setItem('dhtProgress_'+currentUser.id,JSON.stringify(p))}
function recordPractice(topic,correct){const p=progressData();p.attempts++;if(correct)p.correct++;if(topic&&!p.topics.includes(topic))p.topics.push(topic);p.recent.unshift({topic:topic||'Practice',date:new Date().toLocaleDateString()});p.recent=p.recent.slice(0,5);saveProgress(p)}
function recordTest(score,total,title){const p=progressData();p.tests++;p.testScores.push({score,total,title,date:new Date().toLocaleDateString()});p.recent.unshift({topic:title,date:new Date().toLocaleDateString()});p.recent=p.recent.slice(0,5);saveProgress(p)}
function progressPage(){if(!currentUser)return login();const p=progressData(),accuracy=p.attempts?Math.round(p.correct/p.attempts*100):0,avg=p.testScores.length?Math.round(p.testScores.reduce((a,x)=>a+(x.total?x.score/x.total*100:0),0)/p.testScores.length):0;return `<main><div class="back"><button onclick="go('dashboard')">← Back to Dashboard</button></div><div class="breadcrumb">Student / My Progress</div><h1>My Progress</h1><p style="color:var(--muted)">Track your practice, tests and revision activity.</p><div class="grid admin-grid"><div class="card stat"><div>📝 Questions Attempted</div><strong>${p.attempts}</strong></div><div class="card stat"><div>🎯 Practice Accuracy</div><strong>${accuracy}%</strong></div><div class="card stat"><div>🧪 Tests Completed</div><strong>${p.tests}</strong></div><div class="card stat"><div>📈 Average Test Score</div><strong>${avg}%</strong></div></div><div class="grid"><div class="panel"><h2>Topics Studied</h2>${p.topics.length?p.topics.map(x=>`<p>✓ ${esc(x)}</p>`).join(''):'<div class="notice">No topics recorded yet. Start revising to build your progress.</div>'}</div><div class="panel"><h2>Recent Activity</h2>${p.recent.length?p.recent.map(x=>`<p><strong>${esc(x.topic)}</strong><br><span style="color:var(--muted)">${esc(x.date)}</span></p>`).join(''):'<div class="notice">No recent activity yet.</div>'}</div></div>${p.testScores.length?`<div class="panel"><h2>Test Results</h2>${p.testScores.map(x=>`<div class="notice" style="margin-bottom:8px"><strong>${esc(x.title)}</strong> — ${x.score}/${x.total} (${x.total?Math.round(x.score/x.total*100):0}%)<br><span style="color:var(--muted)">${esc(x.date)}</span></div>`).join('')}</div>`:''}</main>`}
const pricing=JSON.parse(localStorage.getItem('dhtPricing')||'{}');
const simplifyingQuestions=[
  {q:'Simplify: 4x + 7x',answer:'11x',solution:'4x + 7x = (4 + 7)x = 11x',marks:1},
  {q:'Simplify: 9a − 5a',answer:'4a',solution:'9a − 5a = (9 − 5)a = 4a',marks:1},
  {q:'Simplify: 3y + 6y − 2y',answer:'7y',solution:'3y + 6y − 2y = (3 + 6 − 2)y = 7y',marks:1},
  {q:'Simplify: 8p − 3p + 2p',answer:'7p',solution:'8p − 3p + 2p = (8 − 3 + 2)p = 7p',marks:1},
  {q:'Simplify: 5m + 4n + 2m',answer:'7m+4n',solution:'5m + 2m = 7m, so the expression is 7m + 4n',marks:1}
];
const testQuestions=[
  {q:'Simplify: 6x + 5x',answer:'11x',solution:'(6 + 5)x = 11x',marks:1},
  {q:'Simplify: 10b − 7b',answer:'3b',solution:'(10 − 7)b = 3b',marks:1},
  {q:'Simplify: 2c + 5c − c',answer:'6c',solution:'(2 + 5 − 1)c = 6c',marks:1},
  {q:'Simplify: 4r + 3s + 2r',answer:'6r+3s',solution:'4r + 2r = 6r, so the expression is 6r + 3s',marks:1},
  {q:'Simplify: 9t − 2t + 4t',answer:'11t',solution:'(9 − 2 + 4)t = 11t',marks:1}
];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function header(){return `<header class="header"><div class="header-inner"><div class="brand"><div class="logo">DHT</div><span>Dar Home Tutors Maths Revision Hub</span></div><div class="header-actions"><button class="ghost" onclick="go('login')">Log in</button><button class="ghost" onclick="go('admin')">Admin</button></div></div></header>`}
function home(){return `<main><section class="hero"><div><div class="eyebrow">Dar Home Tutors</div><h1>Maths revision made simple.</h1><p>Learn, practise and improve with structured mathematics resources for Cambridge, IB and A Level learners.</p><div class="actions"><button class="cta" onclick="go('curricula')">Get Started</button><button class="ghost" onclick="go('about')">How it works</button></div></div><div class="hero-card"><small>YOUR REVISION HUB</small><div class="math">x² + 5x + 6</div><div>Practice questions • Worked solutions • Tests • Progress</div></div></section><h2 class="section-title">What students can access</h2><div class="grid">${[['📘','Primary / Checkpoint','Build strong foundations.'],['📗','Lower Secondary','Prepare for secondary mathematics.'],['📕','IGCSE','Core and Extended revision.'],['📙','IB MYP','Structured MYP mathematics practice.'],['📓','IBDP','AA and AI, SL and HL.'],['📒','AS & A Level','Pure, Statistics and Mechanics.']].map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></main>`}
function curriculaPage(){return `<main><div class="back"><button onclick="go('home')">← Back</button></div><div class="breadcrumb">Home / Choose curriculum</div><h1>What are you studying?</h1><p style="color:var(--muted)">Select your curriculum to continue.</p><div class="grid">${Object.entries(curricula).map(([k,v])=>`<div class="card"><div class="icon">${k==='igcse'?'📕':k==='ibdp'?'📓':k==='myp'?'📙':k==='alevel'?'📒':'📘'}</div><h3>${v.title}</h3><p>${v.desc}</p><button class="cta" onclick="selectCurriculum('${k}')">Choose</button></div>`).join('')}</div></main>`}
function levels(){const c=curricula[state.curriculum];return `<main><div class="back"><button onclick="go('curricula')">← Back</button></div><div class="breadcrumb">${c.title} / Choose level</div><h1>${c.title}</h1><p style="color:var(--muted)">Choose your level.</p><div class="grid">${c.levels.map((l,i)=>`<div class="card"><div class="icon">${i%2?'📚':'🎓'}</div><h3>${l}</h3><p>Mathematics revision resources.</p><button class="cta" onclick="selectLevel('${esc(l)}')">Open Mathematics</button></div>`).join('')}</div></main>`}
function topicsPage(){const topics=(state.curriculum==='primary'?primaryTopics:secondaryTopics);return `<main><div class="back"><button onclick="go('levels')">← Back</button></div><div class="breadcrumb">${curricula[state.curriculum].title} / ${state.level} / Mathematics</div><h1>Mathematics Topics</h1><p style="color:var(--muted)">Choose a topic to view available revision resources.</p><div class="grid topic-grid">${topics.map((t,i)=>`<div class="card"><div class="icon">${['🔢','🔤','🔷','📐','📊'][i]}</div><h3>${t}</h3><p>Notes, practice and exam-style questions.</p><button class="ghost" onclick="selectTopic('${t}')">View topic</button></div>`).join('')}</div></main>`}
function topicPage(){const t=state.topic;const subs=getSubtopics();return `<main><div class="back"><button onclick="go('topics')">← Back</button></div><div class="breadcrumb">${curricula[state.curriculum].title} / ${state.level} / ${t}</div><h1>${t}</h1><p style="color:var(--muted)">Choose a subtopic and move through lessons, worked examples, practice and tests.</p><div class="list">${subs.map((s,i)=>`<button class="resource" onclick="selectSubtopic('${esc(s)}')"><div class="left"><span class="badge">${i<2?'LESSON':'PRACTICE'}</span><h3>${s}</h3><div style="color:var(--muted)">${i<2?'Learn the concept step by step.':'Build confidence with guided mathematics practice.'}</div></div><span>→</span></button>`).join('')}</div></main>`}
function subtopicPage(){const s=state.subtopic;return `<main><div class="back"><button onclick="go('topic')">← Back to ${state.topic}</button></div><div class="breadcrumb">${curricula[state.curriculum].title} / ${state.level} / ${state.topic} / ${s}</div><div class="panel"><span class="badge">LESSON</span><h1 style="font-size:42px">${s}</h1><p>Students will learn this skill through a clear explanation, worked examples and guided practice.</p><div class="notice"><strong>Lesson structure</strong><br>1. Understand the idea<br>2. See a worked example<br>3. Try a practice question<br>4. Check the answer and solution<br>5. Continue to the next skill</div><div class="actions"><button class="cta" onclick="go('lesson')">Start Lesson</button></div></div></main>`}
function lesson(){return `<main><div class="back"><button onclick="go('subtopic')">← Back to lesson</button></div><div class="breadcrumb">${state.topic} / ${state.subtopic}</div><div class="panel"><span class="badge">STEP 1 • LEARN</span><h1 style="font-size:42px">Simplifying expressions</h1><p><strong>Like terms</strong> have the same variable part. We add or subtract their coefficients.</p><div class="notice"><strong>Worked example 1</strong><br>2x + 3x = 5x<br><br>Both terms contain x, so we add 2 + 3.<br><br><strong>Worked example 2</strong><br>7a − 4a = 3a<br><br>Both terms contain a, so we subtract 4 from 7.</div><h2>Remember</h2><p>You can combine 4x and 7x, but you cannot combine 4x and 7y because they are not like terms.</p><div class="actions"><button class="cta" onclick="go('practice')">Try Practice Question</button></div></div></main>`}
function getActiveQuestions(){const bank=questionBank.filter(q=>q.curriculum===curricula[state.curriculum].title&&q.level===state.level&&q.topic===state.topic&&(!q.subtopic||q.subtopic===state.subtopic));return bank.length?bank:(state.curriculum==='lower'&&state.level==='Year 9'&&state.topic==='Algebra'&&state.subtopic==='Simplifying expressions'?simplifyingQuestions:[])}
function practice(){const qs=state.questions;const q=qs[state.practiceIndex];const done=state.practiceIndex>=qs.length;return `<main><div class="back"><button onclick="go('subtopic')">← Back to lesson</button></div><div class="breadcrumb">${state.topic} / ${state.subtopic} / Practice</div><div class="panel"><span class="badge">STEP 2 • PRACTISE</span>${done?`<h1 style="font-size:42px">Practice Complete</h1><div class="notice"><strong>Your score: ${state.practiceScore} / ${qs.reduce((a,x)=>a+x.marks,0)}</strong><br>You have completed the guided practice.</div><div class="actions"><button class="cta" onclick="go('test')">Start Topic Test</button></div>`:`<p style="color:var(--muted)">Question ${state.practiceIndex+1} of ${qs.length} • Score: ${state.practiceScore}</p><h1 style="font-size:42px">Practice Question</h1><h2>${esc(q.q)}</h2><input id="answerBox" placeholder="Type your answer" ${state.practiceAnswered?'disabled':''}><div class="actions">${state.practiceAnswered?`<button class="cta" onclick="nextPractice()">${state.practiceIndex===qs.length-1?'Finish Practice':'Next Question'}</button>`:`<button class="cta" onclick="checkAnswer()">Check Answer</button>`}</div><div id="feedback" style="margin-top:16px">${state.practiceAnswered?state.practiceFeedback:''}</div>`}</div></main>`}
function checkAnswer(){const q=state.questions[state.practiceIndex];const a=document.getElementById('answerBox').value.trim().replace(/\s/g,'').toLowerCase();const correct=a===q.answer.toLowerCase().replace(/\s/g,'');state.practiceAnswered=true;if(correct)state.practiceScore+=q.marks;state.practiceFeedback=correct?`<div class="notice"><strong>Correct! ✓</strong><br>${esc(q.solution||'Well done.')}</div>`:`<div class="notice"><strong>Not quite.</strong><br>The answer is <strong>${esc(q.answer)}</strong>.<br>${esc(q.solution||'Review the worked solution.')}</div>`;render()}
function nextPractice(){if(state.practiceIndex<state.questions.length-1){state.practiceIndex++;state.practiceAnswered=false;state.practiceFeedback='';render()}else{state.practiceIndex=state.questions.length;render()}}
function test(){const qs=state.questions;const q=qs[state.testIndex];const done=state.testIndex>=qs.length;return `<main><div class="back"><button onclick="go('practice')">← Back to practice</button></div><div class="panel"><span class="badge">STEP 3 • TEST</span>${done?`<h1 style="font-size:42px">Test Complete</h1><div class="notice"><strong>Your score: ${state.testScore} / ${qs.reduce((a,x)=>a+x.marks,0)}</strong><br>Keep practising and revisit any questions you missed.</div><div class="actions"><button class="cta" onclick="go('topic')">Back to Topic</button></div>`:`<p style="color:var(--muted)">Question ${state.testIndex+1} of ${qs.length} • Score: ${state.testScore}</p><h1 style="font-size:42px">Quick Topic Test</h1><h2>${esc(q.q)}</h2><input id="testAnswerBox" placeholder="Type your answer" ${state.testAnswered?'disabled':''}><div class="actions">${state.testAnswered?`<button class="cta" onclick="nextTest()">${state.testIndex===qs.length-1?'Finish Test':'Next Question'}</button>`:`<button class="cta" onclick="checkTestAnswer()">Check Answer</button>`}</div><div id="testFeedback" style="margin-top:16px">${state.testAnswered?state.testFeedback:''}</div>`}</div></main>`}
function checkTestAnswer(){const q=state.questions[state.testIndex];const a=document.getElementById('testAnswerBox').value.trim().replace(/\s/g,'').toLowerCase();const correct=a===q.answer.toLowerCase().replace(/\s/g,'');state.testAnswered=true;if(correct)state.testScore+=q.marks;state.testFeedback=correct?`<div class="notice"><strong>Correct! ✓</strong><br>${esc(q.solution||'Well done.')}</div>`:`<div class="notice"><strong>Not quite.</strong><br>The answer is <strong>${esc(q.answer)}</strong>.<br>${esc(q.solution||'Review the worked solution.')}</div>`;render()}
function nextTest(){if(state.testIndex<state.questions.length-1){state.testIndex++;state.testAnswered=false;state.testFeedback='';render()}else{state.testIndex=state.questions.length;render()}}
function resource(){return `<main><div class="back"><button onclick="go('topic')">← Back</button></div><div class="panel"><span class="badge">FREE SAMPLE</span><h1 style="font-size:42px">${state.topic}: introduction</h1><p>Here students will see a short sample of your teaching material before deciding whether to unlock the full revision pack.</p><div class="notice"><strong>Example:</strong> Your own notes, diagrams and worked examples can be placed here.</div><div class="actions"><button class="cta" onclick="go('pay')">Unlock full pack</button></div></div></main>`}
function packKey(){return `${state.curriculum||''}|${state.level||''}|${state.topic||''}`}
function packPrice(){return Number(pricing[packKey()]||5000)}
function pay(){const price=packPrice(),unlocked=currentUser?.unlocked||[],key=packKey(),already=unlocked.includes(key);return `<main><div class="back"><button onclick="go('topic')">← Back</button></div><div class="panel form"><span class="badge">PREMIUM ACCESS</span><h1 style="font-size:40px">Unlock ${esc(state.topic||'Revision Pack')}</h1><p style="color:var(--muted)">${currentUser?'Signed in as '+esc(currentUser.name):'Create an account or log in before purchasing.'}</p><div class="notice"><strong>Revision Pack includes:</strong><br>✓ Topic notes<br>✓ Worked examples<br>✓ Practice questions<br>✓ Exam-style questions<br>✓ Answers / mark schemes<br>✓ Topic test</div><h2>TSh ${price.toLocaleString()}</h2>${already?`<div class="notice"><strong>Already unlocked ✓</strong><br>This revision pack is available on your account.</div><div class="actions"><button class="cta" onclick="go('topic')">Open Revision Pack</button></div>`:`<div class="notice"><strong>Prototype payment</strong><br>In the production app this button will open a secure payment provider. For now it simulates a successful purchase so we can test the complete student journey.</div><div class="actions"><button class="cta" onclick="purchasePack()">Pay TSh ${price.toLocaleString()} & Unlock</button></div>`}</div></main>`}

async function saveMaterial(){const file=document.getElementById('mFile').files[0];const m={curriculum:document.getElementById('mCurriculum').value,level:document.getElementById('mLevel').value.trim(),topic:document.getElementById('mTopic').value.trim(),title:document.getElementById('mTitle').value.trim(),access:document.getElementById('mAccess').value,file_name:file?file.name:'',file_path:''};if(!m.level||!m.topic||!m.title||!file){alert('Please complete Level, Topic, Material title and choose a file.');return}if(file.size>20*1024*1024){alert('Please use a file smaller than 20 MB.');return}if(!currentUser||currentUser.role!=='admin'){alert('Admin access required.');return}const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=currentUser.id+'/'+Date.now()+'_'+safeName;const {error:uploadError}=await supabaseClient.storage.from('revision-materials').upload(path,file,{upsert:false});if(uploadError){alert('Could not upload file: '+uploadError.message);return}m.file_path=path;const {data,error}=await supabaseClient.from('materials').insert({curriculum:m.curriculum,level:m.level,topic:m.topic,title:m.title,access:m.access,file_name:m.file_name,file_path:m.file_path}).select('*').single();if(error){await supabaseClient.storage.from('revision-materials').remove([path]);alert('Could not save material record: '+error.message);return}materials=[data,...materials];alert('Revision material uploaded successfully.');go('materials')}
async function deleteMaterial(i){if(!confirm('Delete this material?'))return;const m=materials[i];if(!m)return;if(m.file_path){const {error}=await supabaseClient.storage.from('revision-materials').remove([m.file_path]);if(error){alert('Could not delete file: '+error.message);return}}if(m.id){const {error}=await supabaseClient.from('materials').delete().eq('id',m.id);if(error){alert('Could not delete material record: '+error.message);return}}materials.splice(i,1);go('materials')}

function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(quoted){if(ch==='"'&&next==='"'){cell+='"';i++}else if(ch==='"'){quoted=false}else{cell+=ch}}else{if(ch==='"'){quoted=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch==='\r'){if(next==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else{cell+=ch}}}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!==''))}
function importCSV(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const rows=parseCSV(reader.result);if(rows.length<2){alert('The CSV file has no question rows.');return}const headers=rows[0].map(h=>h.trim().toLowerCase());const required=['curriculum','level','topic','subtopic','question','marks','answer','worked solution'];const missing=required.filter(h=>!headers.includes(h));if(missing.length){alert('Missing CSV columns: '+missing.join(', '));return}const idx=Object.fromEntries(headers.map((h,i)=>[h,i]));let imported=0,skipped=0;rows.slice(1).forEach(r=>{const q={curriculum:(r[idx.curriculum]||'').trim(),level:(r[idx.level]||'').trim(),topic:(r[idx.topic]||'').trim(),subtopic:(r[idx.subtopic]||'').trim(),q:(r[idx.question]||'').trim(),marks:Number((r[idx.marks]||'').trim())||1,answer:(r[idx.answer]||'').trim(),solution:(r[idx['worked solution']]||'').trim()};if(q.curriculum&&q.level&&q.topic&&q.q&&q.answer){questionBank.push(q);imported++}else{skipped++}});localStorage.setItem('dhtQuestionBank',JSON.stringify(questionBank));alert(imported+' question(s) imported'+(skipped?', '+skipped+' skipped.':'.'));event.target.value='';go('questionbank')};reader.readAsText(file)}
function downloadCSVTemplate(){const rows=[['Curriculum','Level','Topic','Subtopic','Question','Marks','Answer','Worked Solution'],['IGCSE','Extended','Algebra','Simplifying expressions','Simplify: 4x + 7x','1','11x','4x + 7x = 11x']];const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Dar-Home-Tutors-Question-Bank-Template.csv';a.click();URL.revokeObjectURL(a.href)}
function deleteQuestion(i){if(confirm('Delete this question?')){questionBank.splice(i,1);localStorage.setItem('dhtQuestionBank',JSON.stringify(questionBank));go('questionbank')}}
function testsPage(){let h=`<main><div class="back"><button onclick="go('admin')">← Back to Admin</button></div><div class="breadcrumb">Admin / Tests & Exams</div><h1>Tests & Exams</h1><p style="color:var(--muted)">Create a test by selecting questions from your Question Bank, then preview it as a student.</p><div class="panel form"><span class="badge">CREATE TEST</span><h2>New test</h2><label>Test title</label><input id="testTitle" placeholder="e.g. Year 9 Algebra Assessment"><label>Curriculum</label><select id="testCurriculum"><option>Primary / Checkpoint</option><option>Lower Secondary</option><option>IGCSE</option><option>IB MYP</option><option>IBDP</option><option>AS & A Level</option></select><label>Level</label><input id="testLevel" placeholder="e.g. Year 9, Extended, AA HL"><label>Topic</label><input id="testTopic" placeholder="e.g. Algebra"><label>Duration (minutes)</label><input id="testDuration" type="number" min="1" placeholder="e.g. 45"><label>Instructions</label><textarea id="testInstructions" placeholder="Answer all questions. Show your working where required."></textarea></div>`;if(!questionBank.length){h+=`<div class="panel"><div class="notice"><strong>Your Question Bank is empty.</strong><br>Add questions first, then return here to build a test.</div><div class="actions"><button class="cta" onclick="go('addquestion')">Add Questions</button></div></div>`}else{h+=`<div class="panel"><span class="badge">SELECT QUESTIONS</span><h2>Choose questions for this test</h2><p style="color:var(--muted)">Tick the questions you want to include.</p><div class="list">`;questionBank.forEach((q,i)=>{h+=`<label style="font-weight:400;margin:0"><div class="panel" style="margin:0"><input type="checkbox" class="testQuestion" value="${i}" style="width:auto;margin-right:10px"> <strong>${esc(q.q)}</strong><br><span style="color:var(--muted);margin-left:25px">${esc(q.curriculum)} • ${esc(q.level)} • ${esc(q.topic)}${q.subtopic?' • '+esc(q.subtopic):''} • ${q.marks} mark(s)</span></div></label>`});h+=`</div><div class="actions"><button class="cta" onclick="saveTest()">Save Test</button></div></div>`}if(tests.length){h+=`<h2 class="section-title">Saved Tests</h2><div class="list">`;tests.forEach((t,i)=>{h+=`<div class="panel"><span class="badge">${esc(t.curriculum)} • ${esc(t.level)}</span><h3>${esc(t.title)}</h3><p style="color:var(--muted)">${esc(t.topic||'All topics')} • ${t.questions.length} question(s)${t.duration?' • '+t.duration+' minutes':''}</p><div class="actions"><button class="cta" onclick="takeExam(${i})">Preview / Take Test</button><button class="ghost" onclick="deleteTest(${i})">Delete</button></div></div>`});h+=`</div>`}return h+`</main>`}
function saveTest(){const title=document.getElementById('testTitle').value.trim(),curriculum=document.getElementById('testCurriculum').value,level=document.getElementById('testLevel').value.trim(),topic=document.getElementById('testTopic').value.trim(),duration=Number(document.getElementById('testDuration').value)||0,instructions=document.getElementById('testInstructions').value.trim();const selected=[...document.querySelectorAll('.testQuestion:checked')].map(x=>Number(x.value));if(!title||!level||!selected.length){alert('Please enter a test title and level, and select at least one question.');return}const test={id:'test_'+Date.now(),title,curriculum,level,topic,duration,instructions,questions:selected.map(i=>questionBank[i])};tests.push(test);localStorage.setItem('dhtTests',JSON.stringify(tests));alert('Test created successfully.');go('tests')}
function deleteTest(i){if(confirm('Delete this test?')){tests.splice(i,1);localStorage.setItem('dhtTests',JSON.stringify(tests));go('tests')}}
function takeExam(i){state.exam=tests[i];state.examIndex=0;state.examScore=0;state.examAnswered=false;state.examFeedback='';go('takeexam')}
function examRunner(){const t=state.exam;if(!t)return testsPage();const qs=t.questions,q=qs[state.examIndex],done=state.examIndex>=qs.length;return `<main><div class="back"><button onclick="go('tests')">← Back to Tests</button></div><div class="breadcrumb">${esc(t.title)} / Test</div><div class="panel"><span class="badge">${esc(t.curriculum)} • ${esc(t.level)}</span>${done?`<h1 style="font-size:42px">Test Complete</h1><div class="notice"><strong>Score: ${state.examScore} / ${qs.reduce((a,x)=>a+Number(x.marks||1),0)}</strong><br>You have completed this test.</div><div class="actions"><button class="cta" onclick="go('tests')">Return to Tests</button></div>`:`<h1 style="font-size:42px">${esc(t.title)}</h1>${t.instructions?`<div class="notice"><strong>Instructions</strong><br>${esc(t.instructions)}</div>`:''}<p style="color:var(--muted)">Question ${state.examIndex+1} of ${qs.length}${t.duration?' • Time allowed: '+t.duration+' minutes':''} • Score: ${state.examScore}</p><h2>${esc(q.q)}</h2><p style="color:var(--muted)">${q.marks} mark(s)</p><input id="examAnswerBox" placeholder="Type your answer" ${state.examAnswered?'disabled':''}><div class="actions">${state.examAnswered?`<button class="cta" onclick="nextExam()">${state.examIndex===qs.length-1?'Finish Test':'Next Question'}</button>`:`<button class="cta" onclick="checkExamAnswer()">Submit Answer</button>`}</div><div style="margin-top:16px">${state.examAnswered?state.examFeedback:''}</div>`}</div></main>`}
function checkExamAnswer(){const q=state.exam.questions[state.examIndex],a=document.getElementById('examAnswerBox').value.trim().replace(/\s/g,'').toLowerCase(),correct=a===String(q.answer).toLowerCase().replace(/\s/g,'');state.examAnswered=true;if(correct)state.examScore+=Number(q.marks||1);state.examFeedback=correct?`<div class="notice"><strong>Correct! ✓</strong><br>${esc(q.solution||'Well done.')}</div>`:`<div class="notice"><strong>Incorrect.</strong><br>Correct answer: <strong>${esc(q.answer)}</strong><br>${esc(q.solution||'Review the worked solution.')}</div>`;render()}
function nextExam(){if(state.examIndex<state.exam.questions.length-1){state.examIndex++;state.examAnswered=false;state.examFeedback='';render()}else{state.examIndex=state.exam.questions.length;recordTest(state.examScore,state.exam.questions.reduce((a,x)=>a+Number(x.marks||1),0),state.exam.title);render()}}
function addquestion(){return `<main><div class="back"><button onclick="go('admin')">← Back</button></div><div class="panel form"><span class="badge">QUESTION BANK</span><h1 style="font-size:40px">Add Question</h1><label>Curriculum</label><select id="qCurriculum"><option>IGCSE</option><option>Primary / Checkpoint</option><option>Lower Secondary</option><option>IB MYP</option><option>IBDP</option><option>AS & A Level</option></select><label>Level</label><input id="qLevel" placeholder="e.g. Extended, Year 9, AA HL"><label>Topic</label><input id="qTopic" placeholder="e.g. Algebra"><label>Subtopic</label><input id="qSubtopic" placeholder="e.g. Simplifying expressions"><label>Question</label><textarea id="qText" placeholder="Type your question here..."></textarea><label>Marks</label><input id="qMarks" type="number" min="1" value="1"><label>Answer</label><textarea id="qAnswer" placeholder="Enter the correct answer..."></textarea><label>Worked Solution</label><textarea id="qSolution" placeholder="Enter the full worked solution..."></textarea><label>Diagram / Image</label><input id="qImage" type="file" accept="image/*"><div class="actions"><button class="cta" onclick="saveQuestion()">Save Question</button><button class="ghost" onclick="go('admin')">Cancel</button></div></div></main>`}
async function saveQuestion(){const q={curriculum:document.getElementById('qCurriculum').value,level:document.getElementById('qLevel').value.trim(),topic:document.getElementById('qTopic').value.trim(),subtopic:document.getElementById('qSubtopic').value.trim(),question:document.getElementById('qText').value.trim(),marks:Number(document.getElementById('qMarks').value)||1,answer:document.getElementById('qAnswer').value.trim(),worked_solution:document.getElementById('qSolution').value.trim()};if(!q.level||!q.topic||!q.question||!q.answer){alert('Please complete Level, Topic, Question and Answer.');return}const {data,error}=await supabaseClient.from('questions').insert(q).select('*').single();if(error){alert('Could not save question: '+error.message);return}await loadQuestionBank();alert('Question added to the Question Bank.');go('admin')}
function about(){return `<main><div class="back"><button onclick="go('home')">← Back</button></div><div class="panel"><h1 style="font-size:42px">How it works</h1><p>Students select their curriculum, level and mathematics topic. They can preview selected resources, purchase premium content, and then access the full material.</p><p>You, as the administrator, will be able to add your own questions, worked solutions, tests and revision materials through a private dashboard.</p><div class="notice"><strong>Build status:</strong> This is the first interactive prototype. Accounts, secure content storage, real payments and app-store packaging are the next development stages.</div></div></main>`}
if(supabaseClient){supabaseClient.auth.getSession().then(async ({data})=>{if(data.session){await loadSupabaseUser(data.session.user);await loadQuestionBank();await loadStudentQuestions();await loadMaterials()}render()}).catch(()=>render());supabaseClient.auth.onAuthStateChange((event,session)=>{if(!session){currentUser=null;localStorage.removeItem('dhtCurrentUser')}})}else{render()}
function go(page){state.page=page; render(); window.scrollTo(0,0)}
function selectCurriculum(k){state.curriculum=k; go('levels')}
function selectLevel(l){state.level=l; go('topics')}
function selectTopic(t){state.topic=t; state.subtopic=null; go('topic')}
function selectSubtopic(s){state.subtopic=s; state.practiceIndex=0; state.practiceScore=0; state.practiceAnswered=false; state.practiceFeedback=''; state.testIndex=0; state.testScore=0; state.testAnswered=false; state.testFeedback=''; state.questions=getActiveQuestions(); go('subtopic')}
function render(){let body=state.page==='home'?home():state.page==='curricula'?curriculaPage():state.page==='levels'?levels():state.page==='topics'?topicsPage():state.page==='topic'?topicPage():state.page==='subtopic'?subtopicPage():state.page==='lesson'?lesson():state.page==='practice'?practice():state.page==='test'?test():state.page==='resource'?resource():state.page==='pay'?pay():state.page==='pricing'?pricingPage():state.page==='login'?login():state.page==='signup'?signup():state.page==='dashboard'?dashboard():state.page==='progress'?progressPage():state.page==='studentmaterials'?studentMaterials():state.page==='admin'?admin():state.page==='questionbank'?questionbank():state.page==='addquestion'?addquestion():state.page==='materials'?materialsPage():state.page==='tests'?testsPage():state.page==='takeexam'?examRunner():state.page==='courses'?courses():state.page==='students'?students():about();document.getElementById('app').innerHTML=header()+body+`<footer>Dar Home Tutors Maths Revision Hub • Prototype</footer>`}
render();
</script>
</body>
